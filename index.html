<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweetalig · Exámenes Orales</title>
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ===== PROCESSA · Identidad de marca ===== */
:root {
  --oliva:        #3B4A2A;
  --oliva-hover:  #2F3C21;
  --oliva-texto:  #4E6B34;
  --hueso:        #F4F1EA;
  --salvia:       #E6E8DA;
  --blanco:       #FFFFFF;
  --linea:        #D9DBCC;
  --tinta:        #232C1A;
  --tinta-suave:  #5A6450;
  --error:        #B3402A;
  --exito:        #4E6B34;
  --warn:         #92400e;
  --font-titulo:  'Space Grotesk', system-ui, sans-serif;
  --font-texto:   'Manrope', system-ui, sans-serif;
  --r-sm: 6px; --r-md: 10px; --r-lg: 16px;
  /* aliases para no romper JS que use var(--accent/brand/etc) */
  --accent:  var(--oliva);
  --accent2: var(--oliva-hover);
  --brand:   var(--oliva);
  --bg:      var(--hueso);
  --card:    var(--blanco);
  --text:    var(--tinta);
  --muted:   var(--tinta-suave);
  --border:  var(--linea);
  --danger:  var(--error);
  --success: var(--exito);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-texto); background: var(--hueso); color: var(--tinta); min-height: 100vh; font-size: 15px; line-height: 1.6; }
h1,h2,h3 { font-family: var(--font-titulo); color: var(--oliva); line-height: 1.15; letter-spacing: -.02em; }
.hidden { display: none !important; }
.flex { display: flex; }
.gap-2 { gap: 8px; } .gap-3 { gap: 12px; }
.items-center { align-items: center; } .justify-between { justify-content: space-between; } .wrap { flex-wrap: wrap; }
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.w100{width:100%}.text-sm{font-size:.82rem}.text-muted{color:var(--tinta-suave)}
.bold{font-weight:700}.text-accent{color:var(--oliva)}.text-danger{color:var(--error)}

/* NAV */
.topnav{background:var(--oliva);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;}
.topnav-logo{display:flex;align-items:center;gap:12px;}
.topnav-logo img{height:36px;object-fit:contain;background:#fff;border-radius:var(--r-sm);padding:3px 8px;}
.topnav-logo span{font-family:var(--font-titulo);font-weight:700;font-size:1rem;letter-spacing:.3px;}
.topnav-right{display:flex;align-items:center;gap:16px;}
.topnav-right .user-pill{background:rgba(255,255,255,.12);border-radius:20px;padding:4px 14px;font-size:.8rem;}
.btn-logout{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:var(--r-sm);padding:5px 14px;font-size:.8rem;cursor:pointer;font-family:var(--font-texto);}
.btn-logout:hover{background:rgba(255,255,255,.12);}
.shell{display:flex;min-height:calc(100vh - 56px);}
.sidebar{width:230px;background:var(--oliva);padding:16px 0;flex-shrink:0;display:flex;flex-direction:column;gap:2px;}
.sidebar a,.sidebar button.nav-btn{display:block;width:100%;text-align:left;padding:10px 20px;color:rgba(255,255,255,.7);text-decoration:none;font-size:.88rem;border-left:3px solid transparent;border-right:none;border-top:none;border-bottom:none;background:none;cursor:pointer;transition:all .15s;font-family:var(--font-texto);}
.sidebar a:hover,.sidebar a.active,.sidebar button.nav-btn:hover,.sidebar button.nav-btn.active{color:#fff;background:rgba(255,255,255,.1);border-left-color:var(--hueso);}
.sidebar-section{padding:10px 20px 4px;font-size:.68rem;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.35);font-family:var(--font-titulo);}
.main{flex:1;padding:28px;overflow-y:auto;background:var(--hueso);}

/* CARDS */
.card{background:var(--blanco);border-radius:var(--r-lg);box-shadow:0 1px 6px rgba(35,44,26,.08);padding:24px;margin-bottom:20px;border:1px solid var(--linea);}
.card-title{font-family:var(--font-titulo);font-size:.95rem;font-weight:700;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--oliva);color:var(--oliva);}

/* FORMS */
label{display:block;font-size:.8rem;font-weight:600;margin-bottom:4px;margin-top:12px;color:var(--tinta-suave);text-transform:uppercase;letter-spacing:.4px;font-family:var(--font-titulo);}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],input[type=tel],select,textarea{
  width:100%;padding:10px 14px;border:1px solid var(--linea);border-radius:var(--r-md);font-size:.92rem;color:var(--tinta);background:var(--blanco);transition:border-color .15s,outline .15s;font-family:var(--font-texto);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--oliva-texto);outline-offset:1px;border-color:var(--oliva-texto);}
textarea{resize:vertical;min-height:60px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.form-row-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;}
@media(max-width:600px){.form-row,.form-row-3,.form-row-4{grid-template-columns:1fr;}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 20px;border-radius:var(--r-md);border:1.5px solid transparent;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .15s;text-decoration:none;font-family:var(--font-texto);}
.btn-primary{background:var(--oliva);color:var(--hueso);border-color:var(--oliva);}
.btn-primary:hover{background:var(--oliva-hover);border-color:var(--oliva-hover);}
.btn-secondary{background:transparent;color:var(--oliva);border-color:var(--linea);}
.btn-secondary:hover{background:var(--salvia);border-color:var(--oliva);}
.btn-danger{background:#fde8e8;color:var(--error);border-color:#fbd5d5;}
.btn-danger:hover{background:#fbd5d5;}
.btn-warn{background:#fef3c7;color:var(--warn);border-color:#fde68a;}
.btn-warn:hover{background:#fde68a;}
.btn-green{background:#d1fae5;color:#065f46;border-color:#a7f3d0;}
.btn-green:hover{background:#a7f3d0;}
.btn-sm{padding:5px 12px;font-size:.78rem;}
.btn-block{width:100%;justify-content:center;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* BADGES */
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.7rem;font-weight:700;font-family:var(--font-titulo);}
.badge-green{background:#d1fae5;color:#065f46;}
.badge-yellow{background:#fef3c7;color:#92400e;}
.badge-red{background:#fee2e2;color:#991b1b;}
.badge-blue{background:var(--salvia);color:var(--oliva);}
.badge-gray{background:var(--salvia);color:var(--tinta-suave);}
.badge-purple{background:#ede9fe;color:#5b21b6;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
.stat-tile{background:var(--blanco);border-radius:var(--r-md);padding:16px 20px;box-shadow:0 1px 4px rgba(35,44,26,.07);border:1px solid var(--linea);}
.stat-tile .num{font-family:var(--font-titulo);font-size:2rem;font-weight:700;color:var(--oliva);}
.stat-tile .lbl{font-size:.73rem;color:var(--tinta-suave);margin-top:2px;text-transform:uppercase;letter-spacing:.4px;}

/* TABLES */
.table-wrap{overflow-x:auto;border-radius:var(--r-md);border:1px solid var(--linea);}
table{width:100%;border-collapse:collapse;font-size:.86rem;}
th{background:var(--salvia);padding:10px 14px;text-align:left;color:var(--tinta-suave);font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;font-family:var(--font-titulo);}
td{padding:10px 14px;border-top:1px solid var(--linea);}
tr:hover td{background:var(--hueso);}

/* SLOT CARDS */
.slot-list{display:flex;flex-direction:column;gap:12px;}
.slot-card{background:var(--blanco);border-radius:var(--r-md);overflow:hidden;box-shadow:0 1px 4px rgba(35,44,26,.07);border:1px solid var(--linea);}
.slot-head{background:var(--oliva);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;}
.slot-head .title{font-family:var(--font-titulo);font-weight:700;font-size:.9rem;}
.slot-body{padding:0;}
.slot-empty{padding:14px 16px;color:var(--tinta-suave);font-size:.85rem;font-style:italic;}

/* LOGIN */
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--oliva);}
.login-box{background:var(--blanco);border-radius:var(--r-lg);box-shadow:0 8px 40px rgba(0,0,0,.25);padding:40px;width:380px;max-width:95vw;}
.login-logo{text-align:center;margin-bottom:24px;}
.login-logo .app-name{font-family:var(--font-titulo);font-size:1.2rem;font-weight:700;color:var(--oliva);margin-top:8px;}
.login-logo .app-sub{font-size:.78rem;color:var(--tinta-suave);}
.login-error{background:#fee2e2;color:var(--error);border-radius:var(--r-sm);padding:8px 12px;font-size:.84rem;margin-top:10px;}

/* STUDENT PAGE */
#studentPage{min-height:100vh;background:var(--hueso);}
.student-header{background:var(--oliva);padding:20px 24px;display:flex;align-items:center;gap:16px;}
.student-header img{height:60px;object-fit:contain;background:var(--blanco);border-radius:var(--r-sm);padding:6px 12px;}
.student-header .logo-wrap{background:var(--blanco);border-radius:var(--r-sm);padding:6px 12px;display:flex;align-items:center;}
.student-header .info{color:var(--blanco);}
.student-header .info h1{font-family:var(--font-titulo);font-size:1.1rem;font-weight:700;color:var(--blanco);}
.student-header .info p{font-size:.82rem;color:rgba(255,255,255,.75);margin-top:2px;}
.student-body{max-width:680px;margin:28px auto;padding:0 16px;}
.franja-pick-grid{display:flex;flex-direction:column;gap:10px;}
.franja-pick-btn{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border:1.5px solid var(--linea);border-radius:var(--r-md);background:var(--blanco);cursor:pointer;font-size:.92rem;color:var(--tinta);transition:all .15s;width:100%;text-align:left;font-family:var(--font-texto);}
.franja-pick-btn:hover:not(.fp-full){border-color:var(--oliva);background:var(--salvia);}
.franja-pick-btn.fp-selected{border-color:var(--oliva);background:var(--salvia);box-shadow:inset 3px 0 0 var(--oliva);}
.franja-pick-btn.fp-full{opacity:.5;cursor:not-allowed;background:var(--hueso);}
.confirm-wrap{text-align:center;padding:40px 20px;}
.confirm-icon{font-size:3rem;margin-bottom:12px;}
.confirm-box{background:var(--salvia);border-radius:var(--r-md);padding:20px;margin:20px 0;text-align:left;border:1px solid var(--linea);}
.confirm-box p{margin:5px 0;font-size:.92rem;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(35,44,26,.5);display:flex;align-items:center;justify-content:center;z-index:999;}
.modal{background:var(--blanco);border-radius:var(--r-lg);padding:28px;width:600px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(35,44,26,.2);}
.modal-title{font-family:var(--font-titulo);font-size:1rem;font-weight:700;margin-bottom:16px;color:var(--oliva);}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;border-top:1px solid var(--linea);padding-top:16px;}

/* ALERTS */
.alert{padding:10px 14px;border-radius:var(--r-sm);font-size:.86rem;margin-bottom:14px;}
.alert-info{background:var(--salvia);color:var(--oliva);}
.alert-success{background:#d1fae5;color:#065f46;}
.alert-warn{background:#fef3c7;color:#92400e;}
.alert-danger{background:#fee2e2;color:#991b1b;}

/* COPY LINK */
.copy-link-box{display:flex;gap:8px;align-items:center;background:var(--salvia);border:1px solid var(--linea);border-radius:var(--r-md);padding:8px 12px;margin-top:8px;}
.copy-link-box input{background:none;border:none;flex:1;font-size:.82rem;color:var(--tinta-suave);font-family:var(--font-texto);}
.copy-link-box input:focus{outline:none;}

/* LOGO PREVIEW */
.logo-preview{width:120px;height:60px;object-fit:contain;border:1px solid var(--linea);border-radius:var(--r-sm);background:var(--blanco);padding:4px;}

/* PAGE TABS */
.page-tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--linea);}
.page-tab{padding:9px 20px;border:none;background:none;font-size:.88rem;font-weight:600;color:var(--tinta-suave);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;font-family:var(--font-titulo);}
.page-tab.active{color:var(--oliva);border-bottom-color:var(--oliva);}

/* FRANJA BUILDER */
.franja-builder{border:1px solid var(--linea);border-radius:var(--r-md);padding:14px;margin-bottom:10px;background:var(--hueso);}
.franja-builder-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}

/* PROGRESS BAR */
.prog-bar{height:5px;background:var(--linea);border-radius:3px;overflow:hidden;margin-top:4px;}
.prog-bar-fill{height:100%;background:var(--oliva);border-radius:3px;transition:width .3s;}

/* MEET STATUS */
.meet-pill{display:inline-flex;align-items:center;gap:5px;background:var(--salvia);color:var(--oliva);border-radius:20px;padding:3px 10px;font-size:.75rem;font-weight:700;}
.meet-pill.ready{background:#d1fae5;color:#065f46;}
.meet-pill.pending{background:#fef3c7;color:#92400e;}

/* CHECKBOXES */
.check-row{display:flex;align-items:center;gap:8px;padding:8px 0;}
.check-row input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--oliva);}

/* Quill editor */
.ql-container{font-family:var(--font-texto);font-size:.9rem;border-radius:0 0 var(--r-sm) var(--r-sm);border-color:var(--linea) !important;}
.ql-toolbar{border-radius:var(--r-sm) var(--r-sm) 0 0;border-color:var(--linea) !important;background:var(--salvia);}
.ql-editor{min-height:160px;max-height:320px;overflow-y:auto;}
.ql-editor p{margin-bottom:4px;}
.quill-label{font-size:.78rem;font-weight:600;color:var(--tinta-suave);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;margin-top:12px;font-family:var(--font-titulo);}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {
  getDatabase, ref, set, get, push, onValue, remove, update, serverTimestamp, runTransaction
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyBiDeVFq1XUExoXF__AgYav1NZEmF9oP2Q",
  authDomain: "testxedule.firebaseapp.com",
  projectId: "testxedule",
  databaseURL: "https://testxedule-default-rtdb.firebaseio.com",
  storageBucket: "testxedule.firebasestorage.app",
  messagingSenderId: "369799946945",
  appId: "1:369799946945:web:730f1a5436bf209a5eaa40",
  measurementId: "G-Z2SVCBLBJY"
};

const fbApp = initializeApp(firebaseConfig);
const auth  = getAuth(fbApp);
const db    = getDatabase(fbApp);

// ── Google OAuth / Calendar ─────────────────────────────────────────
// GOOGLE_CLIENT_ID is injected by the superadmin from the org settings
// It lives at orgs/{orgId}/googleClientId
let gCalToken = null; // OAuth access token after user authorizes

function getGoogleClientId() {
  return window._googleClientId || null;
}

async function authorizeGoogleCalendar(clientId) {
  return new Promise((resolve, reject) => {
    const params = new URLSearchParams({
      client_id: clientId,
      redirect_uri: location.origin + location.pathname,
      response_type: 'token',
      scope: 'https://www.googleapis.com/auth/calendar.events',
      prompt: 'consent'
    });
    const popup = window.open('https://accounts.google.com/o/oauth2/v2/auth?' + params, 'gcal_auth', 'width=500,height=600');
    const timer = setInterval(() => {
      try {
        if (popup.closed) { clearInterval(timer); reject(new Error('Popup cerrado')); return; }
        const hash = popup.location.hash;
        if (hash && hash.includes('access_token')) {
          clearInterval(timer);
          popup.close();
          const p = new URLSearchParams(hash.substring(1));
          resolve(p.get('access_token'));
        }
      } catch(e) { /* cross-origin, still loading */ }
    }, 300);
  });
}

async function createCalendarEventWithMeet(token, {title, start, end, teacherEmail, studentName, studentEmail, description}) {
  const event = {
    summary: `Test ${title} — ${studentName}`,
    description: description || `Examen oral programado por TestSchedule`,
    start: { dateTime: start, timeZone: 'America/Bogota' },
    end:   { dateTime: end,   timeZone: 'America/Bogota' },
    attendees: [
      { email: teacherEmail },
      { email: studentEmail }
    ],
    conferenceData: {
      createRequest: {
        requestId: `testschedule-${Date.now()}-${Math.random().toString(36).substr(2,6)}`,
        conferenceSolutionKey: { type: 'hangoutsMeet' }
      }
    }
  };
  const resp = await fetch(
    'https://www.googleapis.com/calendar/v3/calendars/primary/events?conferenceDataVersion=1&sendUpdates=none',
    {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(event)
    }
  );
  if (!resp.ok) {
    const err = await resp.json();
    throw new Error(err.error?.message || 'Error creando evento');
  }
  const data = await resp.json();
  return {
    meetLink: data.conferenceData?.entryPoints?.[0]?.uri || null,
    eventId: data.id,
    eventLink: data.htmlLink
  };
}

// ── ROUTER ──────────────────────────────────────────────────────────
let currentUser = null;
let currentUserData = null;
let _isStudentForm = false; // flag to block renderAuthed when in public form mode

onAuthStateChanged(auth, async user => {
  const hash = location.hash;
  // Public form link — show student form regardless of auth state
  if (hash.startsWith('#form/')) {
    _isStudentForm = true;
    renderStudentForm(hash.replace('#form/', ''));
    return;
  }
  _isStudentForm = false;
  if (user) {
    currentUser = user;
    const snap = await get(ref(db, `users/${user.uid}`));
    currentUserData = snap.val();
    if (!currentUserData) { signOut(auth); return; }
    // Load google client id for org
    if (currentUserData.orgId) {
      const orgSnap = await get(ref(db, `orgs/${currentUserData.orgId}`));
      const org = orgSnap.val() || {};
      if (org.googleClientId) window._googleClientId = org.googleClientId;
    }
    if (!_isStudentForm) renderAuthed();
  } else {
    currentUser = null; currentUserData = null;
    renderLogin();
  }
});

// ══════════════════════════════════════════════════════════════════
// LOGIN
// ══════════════════════════════════════════════════════════════════
function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div id="loginPage">
      <div class="login-box">
        <div class="login-logo">
          <div style="font-size:2.5rem;">📅</div>
          <div class="app-name">TestSchedule</div>
          <div class="app-sub">Gestión de horarios de exámenes</div>
        </div>
        <label>Correo electrónico</label>
        <input type="email" id="li-email" placeholder="tu@correo.com" autocomplete="username">
        <label>Contraseña</label>
        <input type="password" id="li-pass" placeholder="••••••••" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')window._login()">
        <div id="li-err" class="login-error hidden"></div>
        <button class="btn btn-primary btn-block mt-3" onclick="window._login()">Entrar</button>
      </div>
    </div>`;
}

window._login = async () => {
  const email = document.getElementById('li-email').value.trim();
  const pass  = document.getElementById('li-pass').value;
  const err   = document.getElementById('li-err');
  err.classList.add('hidden');
  try { await signInWithEmailAndPassword(auth, email, pass); }
  catch(e) { err.textContent = 'Correo o contraseña incorrectos.'; err.classList.remove('hidden'); }
};

// ══════════════════════════════════════════════════════════════════
// ROUTE
// ══════════════════════════════════════════════════════════════════
function renderAuthed() {
  const role = currentUserData.role;
  if (role === 'superadmin') renderSuperAdmin();
  else if (role === 'admin')  renderOrgAdmin();
  else if (role === 'teacher') renderTeacher();
  else renderLogin();
}

function navHTML(links, orgLogo, orgName) {
  const logoSrc = orgLogo
    ? `<img src="${orgLogo}" alt="${orgName}">`
    : `<span>${orgName || 'TestSchedule'}</span>`;
  return `
    <div class="topnav">
      <div class="topnav-logo">${logoSrc}</div>
      <div class="topnav-right">
        <span class="user-pill">${currentUser.email}</span>
        <button class="btn-logout" onclick="window._logout()">Salir</button>
      </div>
    </div>
    <div class="shell">
      <nav class="sidebar">
        ${links.map(l => `<button class="nav-btn" onclick="window._nav('${l.id}');" id="nav-${l.id}">${l.icon} ${l.label}</button>`).join('')}
      </nav>
      <div class="main" id="mainContent"></div>
    </div>`;
}

window._logout = () => signOut(auth);
window._nav = async (id, pushState=true) => {
  document.querySelectorAll('.sidebar a, .sidebar button.nav-btn').forEach(a => a.classList.remove('active'));
  const el = document.getElementById('nav-' + id);
  if (el) el.classList.add('active');
  if (pushState) history.pushState({navId:id}, '', '#'+id);
  const mc = document.getElementById('mainContent');
  if (!mc) return;
  mc.innerHTML = `<div style="padding:40px;text-align:center;color:#9ca3af;">Cargando...</div>`;
  try {
    if (currentUserData.role === 'superadmin') await renderSASection(id);
    else if (currentUserData.role === 'admin') await renderAdminSection(id);
    else if (currentUserData.role === 'teacher') await renderTeacherSection(id);
  } catch(e) { mc.innerHTML=`<div class="card"><p class="text-muted">Error al cargar: ${e.message}</p></div>`; console.error(e); }
};
window.addEventListener('popstate', e => {
  if (e.state?.navId) window._nav(e.state.navId, false);
});
function activateNav(id) {
  document.querySelectorAll('.sidebar a, .sidebar button.nav-btn').forEach(a => a.classList.remove('active'));
  const el = document.getElementById('nav-' + id);
  if (el) el.classList.add('active');
}

function toast(msg, type='success') {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;top:20px;right:20px;z-index:9999;padding:12px 20px;border-radius:8px;font-size:.88rem;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.15);transition:opacity .3s;
    background:${type==='success'?'#065f46':type==='error'?'#991b1b':'#92400e'};color:#fff;`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 3000);
}

window._createUser = async () => {
  const name=document.getElementById('um-name').value.trim();

  const pass=document.getElementById('um-pass').value;
  const role=document.getElementById('um-role').value;
  const orgId=document.getElementById('um-org')?.value||'';

    const cred=await cu(auth2,email,pass); const uid=cred.user.uid;

window._saveTeacher = async (uid) => {
  const name  = document.getElementById('tm-name').value.trim();
  const email = document.getElementById('tm-email').value.trim();
  const status= document.getElementById('tm-status');
  document.getElementById('tm-btn').disabled = true;
  if (!name||!email){ alert('Completa nombre y correo.'); document.getElementById('tm-btn').disabled=false; return; }

  if (uid) {
    // Edit — just update name in DB (email can't change via admin for Firebase Auth without Admin SDK)
    await update(ref(db,`users/${uid}`), { name });
    document.getElementById('teacherModal').remove();
    toast('Profesor actualizado');
    window._nav('oa-teachers');
  } else {
    const pass = document.getElementById('tm-pass').value;
    if (pass.length<6){ alert('Contraseña mínimo 6 caracteres.'); document.getElementById('tm-btn').disabled=false; return; }
    status.textContent = 'Creando cuenta...';
    try {
      const {initializeApp:ia} = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      const {getAuth:ga,createUserWithEmailAndPassword:cu} = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
      const a2 = ia(firebaseConfig,'tch-'+Date.now()); const auth2 = ga(a2);
      const cred = await cu(auth2, email, pass); const newUid = cred.user.uid;
      await auth2.signOut();
      await set(ref(db,`users/${newUid}`), { name, email, role:'teacher', orgId: currentUserData.orgId });
      status.textContent = 'Profesor creado.';
      setTimeout(()=>{ document.getElementById('teacherModal')?.remove(); window._nav('oa-teachers'); }, 1200);
    } catch(e){ status.textContent='❌ '+e.message; document.getElementById('tm-btn').disabled=false; }
  }
};

window._saveAccountPassword = async () => {
  const p1 = document.getElementById('ac-pass1').value;
  const p2 = document.getElementById('ac-pass2').value;
  const st = document.getElementById('ac-pass-status');
  if (p1.length < 6){ st.innerHTML='<span class="text-danger">Mínimo 6 caracteres.</span>'; return; }
  if (p1 !== p2){ st.innerHTML='<span class="text-danger">Las contraseñas no coinciden.</span>'; return; }
  try {
    const { updatePassword } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
    await updatePassword(currentUser, p1);
    st.innerHTML='<span style="color:var(--success)">Contraseña actualizada.</span>';
    document.getElementById('ac-pass1').value='';
    document.getElementById('ac-pass2').value='';
  } catch(e){
    if (e.code==='auth/requires-recent-login'){
      st.innerHTML='<span class="text-danger">Por seguridad, cierra sesión, vuelve a entrar y cambia la contraseña.</span>';
    } else {
      st.innerHTML='<span class="text-danger">❌ '+e.message+'</span>';
    }
  }
};

// ── GENERATE MEETS ────────────────────────────────────────────────
window._generateMeets = async (fid) => {
  const statusEl=document.getElementById('meet-status');
  const clientId=getGoogleClientId();
  if (!clientId){
    statusEl.innerHTML=`<div class="alert alert-warn">⚠️ Esta organización no tiene configurado el Google Client ID. Pídele al administrador que lo configure en Ajustes de la organización.</div>`;
    return;
  }

  statusEl.innerHTML=`<div class="alert alert-info">🔐 Autorizando con Google Calendar... Se abrirá una ventana de Google.</div>`;

  try {
    const token=await authorizeGoogleCalendar(clientId);
    gCalToken=token;
    statusEl.innerHTML=`<div class="alert alert-success">Autorizado. Generando links de Meet...</div>`;

    const fSnap=await get(ref(db,`forms/${fid}`));
    const f=fSnap.val(); if (!f) return;
    const regs=f.registrations||{};
    const slots=f.slotsMeta||{};

    let created=0, skipped=0, errors=0;
    for (const [rid,r] of Object.entries(regs)){
      if (r.meetLink){ skipped++; continue; }
      const slot=slots[r.slotId];
      if (!slot){ errors++; continue; }

      // Build ISO datetimes from slot
      const datePart=slot.date||new Date().toISOString().split('T')[0];
      const startISO=`${datePart}T${slot.start}:00`;
      const endISO=`${datePart}T${(slot.end||slot.start)}:00`;

      try {
        const result=await createCalendarEventWithMeet(token,{
          title: f.title,
          start: startISO,
          end: endISO,
          teacherEmail: f.teacherEmail,
          studentName: `${r.nombre} ${r.apellido}`,
          studentEmail: r.correo,
          description: `Examen de inglés — ${f.nivel||''} ${f.grupo||''}\nEstudiante: ${r.nombre} ${r.apellido}`
        });
        await update(ref(db,`forms/${fid}/registrations/${rid}`),{
          meetLink: result.meetLink,
          calEventId: result.eventId,
          calEventLink: result.eventLink
        });
        created++;
        statusEl.innerHTML=`<div class="alert alert-info">⏳ Generando... ${created} creados, ${skipped} ya tenían Meet.</div>`;
      } catch(e){ errors++; console.error('Meet error for',rid,e); }

      // Small delay to avoid rate limits
      await new Promise(res=>setTimeout(res,300));
    }

    statusEl.innerHTML=`<div class="alert alert-success">Listo. ${created} links creados, ${skipped} ya existían${errors>0?`, ${errors} errores`:''}.
      <br><button class="btn btn-secondary btn-sm mt-2" onclick="window._openClassDetail('${fid}')">Actualizar vista</button></div>`;

  } catch(e){
    statusEl.innerHTML=`<div class="alert alert-danger">❌ Error: ${e.message}</div>`;
  }
};

function htmlToPlainText(html){
  // Convert HTML from Quill to plain text suitable for mailto body
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  // Replace <br> and block ends with newlines
  tmp.querySelectorAll('br').forEach(br=>br.replaceWith('\n'));
  tmp.querySelectorAll('p,li,h1,h2,h3,h4,div').forEach(el=>{
    const tag = el.tagName.toLowerCase();
    if(tag==='li'){
      el.prepend('• ');
      el.append('\n');
    } else {
      el.append('\n');
    }
  });
  return tmp.textContent.replace(/\n{3,}/g,'\n\n').trim();
}

function buildEmailBody(tpl,reg,slots,form){
  if (!reg||!tpl) return tpl||'';
  // If template is HTML (from Quill), convert to plain text for mailto
  let body = tpl.trim().startsWith('<') ? htmlToPlainText(tpl) : tpl;
  const slot=slots[reg.slotId]||{};
  return body
    .replace(/{nombre}/g,reg.nombre||'')
    .replace(/{apellido}/g,reg.apellido||'')
    .replace(/{correo}/g,reg.correo||'')
    .replace(/{telefono}/g,reg.telefono||'')
    .replace(/{fecha}/g,slot.date||slot.lbl||'—')
    .replace(/{hora}/g,slot.start?(slot.start+(slot.end?' – '+slot.end:'')):'—')
    .replace(/{meet}/g,reg.meetLink||'(pendiente)')
    .replace(/{profe}/g,form.teacherName||'')
    .replace(/{nivel}/g,form.nivel||'')
    .replace(/{grupo}/g,form.grupo||'')
    .replace(/{programa}/g,reg.programa||form.programa||'');
}

function buildEmailBodyHtml(tpl,reg,slots,form){
  // Returns HTML version for preview (keeps formatting)
  if (!reg||!tpl) return tpl||'';
  const slot=slots[reg.slotId]||{};
  let body = tpl.trim().startsWith('<') ? tpl : tpl.split('\n').map(l=>l?`<p>${l}</p>`:'<p><br></p>').join('');
  return body
    .replace(/{nombre}/g,reg.nombre||'')
    .replace(/{apellido}/g,reg.apellido||'')
    .replace(/{correo}/g,reg.correo||'')
    .replace(/{telefono}/g,reg.telefono||'')
    .replace(/{fecha}/g,slot.date||slot.lbl||'—')
    .replace(/{hora}/g,slot.start?(slot.start+(slot.end?' – '+slot.end:'')):'—')
    .replace(/{meet}/g,`<a href="${reg.meetLink||'#'}">${reg.meetLink||'(pendiente)'}</a>`)
    .replace(/{profe}/g,form.teacherName||'')
    .replace(/{nivel}/g,form.nivel||'')
    .replace(/{grupo}/g,form.grupo||'')
    .replace(/{programa}/g,reg.programa||form.programa||'');
}

window._sendEmails = async (fid) => {
  const fSnap=await get(ref(db,`forms/${fid}`));
  const f=fSnap.val(); if (!f) return;
  const orgSnap=await get(ref(db,`orgs/${currentUserData.orgId}`));
  const org=orgSnap.val()||{};
  const regs=f.registrations||{};
  const slots=f.slotsMeta||{};
  const tpl=org.emailTemplate||'';
  const subj=org.emailSubject||'Citación a Examen';

  const checked=[...document.querySelectorAll('.em-chk:checked')].map(c=>c.value);
  if (!checked.length){ toast('Selecciona al menos un estudiante','error'); return; }

  document.getElementById('emailModal').remove();

  let opened=0;
  for (const rid of checked){
    const r=regs[rid]; if (!r) continue;
    const body=buildEmailBody(tpl,r,slots,f);
    const subjFilled=subj
      .replace(/{nombre}/g,r.nombre||'')
      .replace(/{apellido}/g,r.apellido||'');
    const mailto=`mailto:${encodeURIComponent(r.correo)}?subject=${encodeURIComponent(subjFilled)}&body=${encodeURIComponent(body)}`;
    // Open each with a small delay so browser doesn't block popups
    setTimeout(()=>{ window.open(mailto,'_blank'); },opened*600);
    opened++;
  }
  toast(`Se abrirán ${opened} correos en tu cliente de email`);
};

  const regs=Object.entries(allRegs);
  const slots=f.slotsMeta||{};

  if (!window.XLSX){ toast('Cargando Excel...','info'); return; }

  // Sheet 1: all registrations
  const rows=[['Nombre','Apellido','Correo','Teléfono','Franja','Fecha','Hora inicio','Hora fin','Meet','Inscrito']];
  regs.forEach(([,r])=>{
    const s=slots[r.slotId]||{};
    rows.push([r.nombre||'',r.apellido||'',r.correo||'',r.telefono||'',s.label||'',s.date||'',s.start||'',s.end||'',r.meetLink||'',new Date(r.ts||0).toLocaleString('es-CO')]);
  });

  // Sheet 2: by slot
  const bySlotRows=[['Franja','Nombre','Apellido','Correo','Teléfono','Meet']];
  Object.entries(slots).forEach(([sid,s])=>{
    const slotRegs=regs.filter(([,r])=>r.slotId===sid);
    if (slotRegs.length===0){
      bySlotRows.push([s.label,'(sin inscritos)','','','','']);
    } else {
      slotRegs.forEach(([,r])=>{
        bySlotRows.push([s.label,r.nombre||'',r.apellido||'',r.correo||'',r.telefono||'',r.meetLink||'']);
      });
    }
  });

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Todos los inscritos');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(bySlotRows),'Por horario');
  XLSX.writeFile(wb,`${(f.title||'clase').replace(/\s+/g,'-')}.xlsx`);
};

// ── SLOT CALCULATOR ───────────────────────────────────────────────
window._recalcSlots = () => {
  const dateVal  = document.getElementById('nf-gen-date')?.value;
  const startVal = document.getElementById('nf-gen-start')?.value;
  const endVal   = document.getElementById('nf-gen-end')?.value;
  const dur      = parseInt(document.getElementById('nf-gen-dur')?.value)||90;
  const pax      = parseInt(document.getElementById('nf-gen-pax')?.value)||2;
  const preview  = document.getElementById('nf-slots-preview');
  if (!preview) return;

  const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const months=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const fmt = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;

  let slotsHtml = '';
  let totalSlots = 0;
  let totalCupos = 0;

  // 1. Auto-generated slots
  if (startVal && endVal) {
    const [sh,sm] = startVal.split(':').map(Number);
    const [eh,em] = endVal.split(':').map(Number);
    const totalMin = (eh*60+em) - (sh*60+sm);
    if (totalMin > 0) {
      const slotCount = Math.floor(totalMin / dur);
      let dayStr = '';
      if (dateVal) {
        const d = new Date(dateVal+'T12:00:00');
        dayStr = `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
      }
      for (let i=0; i<slotCount; i++) {
        const sMin = sh*60+sm + i*dur;
        const eMin = sMin + dur;
        slotsHtml += `<div style="display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--border);">
          <span>📅</span>
          <span class="text-sm bold">${dayStr ? dayStr+' · ' : ''}${fmt(sMin)} – ${fmt(eMin)}</span>
          <span class="badge badge-blue">${pax} cupo${pax>1?'s':''}</span>
        </div>`;
        totalSlots++; totalCupos += pax;
      }
    }
  }

  // 2. Manual slots — subdivide each franja just like auto-generator
  document.querySelectorAll('#nf-franjas > div[id^="fr-"]').forEach(row => {
    const id = row.id;
    const dv = document.getElementById(`${id}-date`)?.value;
    const sv = document.getElementById(`${id}-start`)?.value;
    const ev = document.getElementById(`${id}-end`)?.value;
    const mx = parseInt(document.getElementById(`${id}-max`)?.value)||2;
    const durM = parseInt(document.getElementById(`${id}-dur`)?.value)||90;
    if (!dv || !sv || !ev) return; // skip incomplete rows
    const [sh2,sm2] = sv.split(':').map(Number);
    const [eh2,em2] = ev.split(':').map(Number);
    const totalMin2 = (eh2*60+em2) - (sh2*60+sm2);
    if (totalMin2 <= 0) return;
    const slotCount2 = Math.floor(totalMin2 / durM);
    const d2 = new Date(dv+'T12:00:00');
    const dayStr2 = `${days[d2.getDay()]} ${d2.getDate()} ${months[d2.getMonth()]}`;
    for (let i=0; i<slotCount2; i++){
      const sMin = sh2*60+sm2 + i*durM;
      const eMin = sMin + durM;
      slotsHtml += `<div style="display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--border);background:#fffbf0;">
        <span>📅</span>
        <span class="text-sm bold">${dayStr2} · ${fmt(sMin)} – ${fmt(eMin)}</span>
        <span class="badge" style="background:#f59e0b;color:#fff;">${mx} cupo${mx>1?'s':''}</span>
        <span class="text-sm text-muted" style="font-size:.74rem;">(manual)</span>
      </div>`;
      totalSlots++; totalCupos += mx;
    }
  });

  if (!totalSlots && !startVal) { preview.innerHTML=''; return; }

  preview.innerHTML=`
    <div style="border:2px solid var(--accent);border-radius:10px;overflow:hidden;">
      <div style="background:var(--accent);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div style="font-weight:800;font-size:.95rem;">📊 ${totalSlots} franja${totalSlots!==1?'s':''} · ${totalCupos} cupo${totalCupos!==1?'s':''} en total</div>
        <div style="font-size:.8rem;opacity:.85;">${dur} min/examen · ${pax} est. por franja auto</div>
      </div>
      <div style="background:#f0faf9;">
        ${totalSlots===0
          ? '<div class="text-muted text-sm" style="padding:14px 16px;">Sin franjas configuradas aún.</div>'
          : slotsHtml}
      </div>
    </div>`;
};

    const ev=document.getElementById(`${id}-end`).value;
    const durV=parseInt(document.getElementById(`${id}-dur`).value)||90;

    const [sh,sm]=sv.split(':').map(Number);

  document.getElementById(`${id}-date`).addEventListener('change',refresh);
  document.getElementById(`${id}-start`).addEventListener('change',refresh);
  document.getElementById(`${id}-end`).addEventListener('change',refresh);

};

window._saveNewForm = async () => {
  const title=document.getElementById('nf-title').value.trim();
  const desc=document.getElementById('nf-desc').value.trim();

  const grupo=document.getElementById('nf-grupo').value.trim();

  const profe=document.getElementById('nf-profe').value.trim();
  const status=document.getElementById('nf-status');
  if (!title) return alert('Escribe el título de la clase.');

  const slotsMeta={};

  // 1. Slots from auto-generator
  const dateVal  = document.getElementById('nf-gen-date')?.value;
  const startVal = document.getElementById('nf-gen-start')?.value;
  const endVal   = document.getElementById('nf-gen-end')?.value;
  const dur      = parseInt(document.getElementById('nf-gen-dur')?.value)||90;
  const pax      = parseInt(document.getElementById('nf-gen-pax')?.value)||2;
  if (dateVal && startVal && endVal) {
    const [sh,sm] = startVal.split(':').map(Number);
    const [eh,em] = endVal.split(':').map(Number);
    const totalMin = (eh*60+em) - (sh*60+sm);
    const slotCount = Math.floor(totalMin / dur);
    const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const months=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const d = new Date(dateVal+'T12:00:00');
    const dayStr = `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
    const fmt = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
    for (let i=0; i<slotCount; i++){
      const sMin = sh*60+sm + i*dur;
      const eMin = sMin + dur;
      const startStr = fmt(sMin);
      const endStr   = fmt(eMin);
      const sid = 'slot-'+Date.now()+'-'+i+'-'+Math.random().toString(36).substr(2,4);
      slotsMeta[sid] = {
        label: `${dayStr} · ${startStr} – ${endStr}`,
        max: pax, start: startStr, end: endStr, date: dateVal, dur
      };
    }
  }

  // 2. Manual slots — subdivide by duration, same logic as auto-generator
  const rows=document.querySelectorAll('#nf-franjas > div[id^="fr-"]');
  for (const row of rows){
    const id=row.id;
    const start=document.getElementById(`${id}-start`)?.value;
    const end=document.getElementById(`${id}-end`)?.value;
    const durM=parseInt(document.getElementById(`${id}-dur`)?.value)||90;
    const max=parseInt(document.getElementById(`${id}-max`)?.value)||2;
    const date=document.getElementById(`${id}-date`)?.value;
    if (!start||!date){ alert(`Completa fecha y hora de inicio en la franja manual.`); return; }
    if (!end){ alert(`Completa hora de fin en la franja manual.`); return; }
    const [sh2,sm2]=start.split(':').map(Number);
    const [eh2,em2]=end.split(':').map(Number);
    const totalMin2=(eh2*60+em2)-(sh2*60+sm2);
    if(totalMin2<=0){ alert(`La hora de fin debe ser mayor que la de inicio en la franja manual.`); return; }
    const slotCount2=Math.floor(totalMin2/durM);
    if(slotCount2===0){ alert(`El rango horario es muy corto para la duración seleccionada (${durM} min).`); return; }
    const fmtM=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
    const d2=new Date(date+'T12:00:00');
    const days2=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const months2=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const dayStr2=`${days2[d2.getDay()]} ${d2.getDate()} ${months2[d2.getMonth()]}`;
    for(let i=0;i<slotCount2;i++){
      const sMin=sh2*60+sm2+i*durM;
      const eMin=sMin+durM;
      const sid='slot-'+Date.now()+'-m'+i+'-'+Math.random().toString(36).substr(2,4);
      slotsMeta[sid]={label:`${dayStr2} · ${fmtM(sMin)} – ${fmtM(eMin)}`,max,start:fmtM(sMin),end:fmtM(eMin),date,dur:durM};
    }
  }

  if (!Object.keys(slotsMeta).length) return alert('Configura el generador de franjas o añade una franja manual.');

  const formRef=push(ref(db,'forms'));
  const fid=formRef.key;
  await set(formRef,{
    title,desc,nivel,grupo,programa,
    teacherName:profe||currentUserData.name,
    teacherUid:currentUser.uid,
    teacherEmail:currentUser.email,
    orgId:currentUserData.orgId,
    active:true,
    createdAt:Date.now(),
    slotsMeta
  });

  const formUrl=`${location.origin}${location.pathname}#form/${fid}`;
  status.innerHTML=`
    <div class="alert alert-success">Clase creada. Comparte este link con tus estudiantes:</div>
    <div class="copy-link-box">
      <input type="text" value="${formUrl}" readonly onclick="this.select()">
      <button class="btn btn-secondary btn-sm" onclick="navigator.clipboard.writeText('${formUrl}').then(()=>toast('¡Copiado!'))">Copiar</button>
    </div>
    <button class="btn btn-primary mt-3" onclick="window._nav('t-forms')">Ver mis clases →</button>`;
};

window._smRecalc = () => {
  const dateVal  = document.getElementById('sm-gen-date')?.value;
  const startVal = document.getElementById('sm-gen-start')?.value;
  const endVal   = document.getElementById('sm-gen-end')?.value;
  const dur      = parseInt(document.getElementById('sm-gen-dur')?.value)||90;
  const pax      = parseInt(document.getElementById('sm-gen-pax')?.value)||2;
  const preview  = document.getElementById('sm-auto-preview');
  if (!preview||!startVal||!endVal) return;

  const [sh,sm2]=startVal.split(':').map(Number);
  const [eh,em]=endVal.split(':').map(Number);
  const totalMin=(eh*60+em)-(sh*60+sm2);
  if (totalMin<=0){preview.innerHTML=`<div class="alert alert-danger">⚠️ Hora fin debe ser mayor que inicio.</div>`;return;}

  const slotCount=Math.floor(totalMin/dur);
  const totalCupos=slotCount*pax;
  const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const months=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  let dayStr='';
  if (dateVal){const d=new Date(dateVal+'T12:00:00');dayStr=`${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;}
  const fmt=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;

  let rows='';
  for (let i=0;i<slotCount;i++){
    const sMin=sh*60+sm2+i*dur; const eMin=sMin+dur;
    rows+=`<div style="display:flex;align-items:center;gap:10px;padding:5px 10px;border-bottom:1px solid var(--border);">
      <span class="text-sm bold">${dayStr?dayStr+' · ':''}${fmt(sMin)} – ${fmt(eMin)}</span>
      <span class="badge badge-blue">${pax} cupo${pax>1?'s':''}</span></div>`;
  }
  preview.innerHTML=`
    <div style="border:2px solid var(--accent);border-radius:10px;overflow:hidden;">
      <div style="background:var(--accent);color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-weight:800;">📊 ${slotCount} franja${slotCount!==1?'s':''} · ${totalCupos} cupo${totalCupos!==1?'s':''}</span>
        <span style="font-size:.78rem;opacity:.85;">${dur} min · ${pax} est/franja</span>
      </div>
      <div style="background:#f0faf9;max-height:220px;overflow-y:auto;">
        ${slotCount===0?'<div class="text-muted text-sm" style="padding:12px;">Rango muy corto.</div>':rows}
      </div>
    </div>`;
};

window._saveSlot=async(fid)=>{
  const isAuto = !document.getElementById('sm-panel-auto').classList.contains('hidden');
  const newSlots={};

  if (isAuto) {
    const dateVal  = document.getElementById('sm-gen-date')?.value;
    const startVal = document.getElementById('sm-gen-start')?.value;
    const endVal   = document.getElementById('sm-gen-end')?.value;
    const dur      = parseInt(document.getElementById('sm-gen-dur')?.value)||90;
    const pax      = parseInt(document.getElementById('sm-gen-pax')?.value)||2;
    if (!startVal||!endVal) return alert('Completa hora inicio y fin.');
    const [sh,sm2]=startVal.split(':').map(Number);
    const [eh,em]=endVal.split(':').map(Number);
    const totalMin=(eh*60+em)-(sh*60+sm2);
    const slotCount=Math.floor(totalMin/dur);
    if (slotCount===0) return alert('El rango es muy corto para la duración seleccionada.');
    const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
    const months=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    let dayStr='';
    if (dateVal){const d=new Date(dateVal+'T12:00:00');dayStr=`${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;}
    const fmt=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
    for (let i=0;i<slotCount;i++){
      const sMin=sh*60+sm2+i*dur; const eMin=sMin+dur;
      const sid='slot-'+Date.now()+'-'+i+'-'+Math.random().toString(36).substr(2,4);
      newSlots[sid]={label:`${dayStr?dayStr+' · ':''}${fmt(sMin)} – ${fmt(eMin)}`,max:pax,start:fmt(sMin),end:fmt(eMin),date:dateVal||'',dur};
    }
  } else {
    const lbl=document.getElementById('sm-lbl').value.trim();
    const start=document.getElementById('sm-start').value;
    const end=document.getElementById('sm-end').value;
    const max=parseInt(document.getElementById('sm-max').value)||2;
    const dur=parseInt(document.getElementById('sm-dur').value)||90;
    const date=document.getElementById('sm-date').value;
    if (!lbl||!start) return alert('Completa la etiqueta y hora de inicio.');
    const sid='slot-'+Date.now();
    newSlots[sid]={label:lbl,max,start,end,date,dur};
  }

  await update(ref(db,`forms/${fid}/slotsMeta`), newSlots);
  document.getElementById('slotModal').remove();
  toast(`${Object.keys(newSlots).length} franja${Object.keys(newSlots).length>1?'s':''}  añadida${Object.keys(newSlots).length>1?'s':''}`);
  window._openClassDetail(fid);
};

window._deleteSlot=async(fid,sid)=>{
  if (!confirm('¿Eliminar esta franja? Los estudiantes asignados perderán su slot.')) return;
  await remove(ref(db,`forms/${fid}/slotsMeta/${sid}`));
  // Remove all registrations in this slot
  const fSnap=await get(ref(db,`forms/${fid}/registrations`));
  const regs=fSnap.val()||{};
  const toDelete=Object.entries(regs).filter(([,r])=>r.slotId===sid);
  for (const [rid] of toDelete) await remove(ref(db,`forms/${fid}/registrations/${rid}`));
  window._openClassDetail(fid);
};

window._toggleFormActive=async(fid,current)=>{
  await update(ref(db,`forms/${fid}`),{active:!current});
  window._nav('t-forms');
};

window._deleteForm=async(fid)=>{
  if (!confirm('¿Eliminar esta clase y todos sus registros?')) return;
  await remove(ref(db,`forms/${fid}`));
  window._nav('t-forms');
};

window._copyLink=(fid)=>{
  const val=document.getElementById(`link-${fid}`)?.value;
  if (val) navigator.clipboard.writeText(val).then(()=>toast('¡Link copiado!'));
};

// ══════════════════════════════════════════════════════════════════
// STUDENT FORM (PUBLIC)
// ══════════════════════════════════════════════════════════════════
async function renderStudentForm(fid){
  const fSnap=await get(ref(db,`forms/${fid}`));
  const f=fSnap.val();

  if (!f){
    document.getElementById('app').innerHTML=`<div style="text-align:center;padding:60px;"><h2>Formulario no encontrado</h2><p class="text-muted">El link puede estar incorrecto.</p></div>`;
    return;
  }
  if (!f.active){
    document.getElementById('app').innerHTML=`<div style="text-align:center;padding:60px;"><h2>Formulario cerrado</h2><p class="text-muted">El período de registro ya cerró.</p></div>`;
    return;
  }

  const orgSnap=await get(ref(db,`orgs/${f.orgId}`));
  const org=orgSnap.val()||{};
  const logoHtml=org.logoUrl
    ?`<div style="background:#fff;border-radius:8px;padding:6px 14px;display:flex;align-items:center;"><img src="${org.logoUrl}" alt="${org.name}" style="height:52px;object-fit:contain;"></div>`
    :`<div style="background:#fff;border-radius:8px;padding:8px 16px;"><span style="font-family:var(--font-titulo);font-weight:700;font-size:1rem;color:var(--oliva);">${org.name||'Tweetalig'}</span></div>`;

  document.getElementById('app').innerHTML=`
    <div id="studentPage">
      <div class="student-header">
        ${logoHtml}
        <div class="info">
          <h1>${f.title}</h1>
          <p>Prof. ${f.teacherName||''} · ${f.nivel||''} ${f.grupo||''}</p>
          ${f.desc?`<p style="margin-top:4px;font-size:.78rem;">${f.desc}</p>`:''}
        </div>
      </div>
      <div class="student-body">
        <div id="sf-form">
          <div class="card">
            <div class="card-title">📋 Tus datos</div>
            <div class="form-row">
              <div><label>Nombre *</label><input type="text" id="sf-nombre" placeholder="Tu nombre"></div>
              <div><label>Apellido *</label><input type="text" id="sf-apellido" placeholder="Tu apellido"></div>
            </div>
            <div class="form-row">
              <div><label>Correo electrónico *</label><input type="email" id="sf-correo" placeholder="tu@correo.com"></div>
              <div><label>Teléfono / WhatsApp *</label><input type="tel" id="sf-tel" placeholder="+57 300 000 0000"></div>
            </div>
          </div>
          <div class="card">
            <div class="card-title">📅 Escoge tu franja horaria</div>
            <div id="sf-slots" class="franja-pick-grid"></div>
          </div>
          <div id="sf-err" class="alert alert-warn hidden">⚠️ Completa todos tus datos y selecciona una franja.</div>
          <button class="btn btn-primary btn-block mt-3" id="sf-btn" onclick="window._submitStudentForm('${fid}')">Confirmar inscripción</button>
        </div>
        <div id="sf-confirm" class="hidden">
          <div class="confirm-wrap">
            <div class="confirm-icon" style="width:64px;height:64px;background:var(--oliva);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F4F1EA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
            <h2>¡Inscripción confirmada!</h2>
            <p class="text-muted mt-2" style="font-size:.95rem;">Hemos registrado tu cita de examen oral.</p>
            <div class="confirm-box" id="sf-confirm-detail"></div>
            <div style="margin-top:16px;padding:14px 16px;background:linear-gradient(135deg,#f3f5f0,#e8ecdf);border:1px solid #c5ceaf;border-radius:10px;text-align:left;">
              <p style="margin:0 0 4px 0;font-weight:700;color:#3B4A2A;font-size:.88rem;">📬 ¿Y ahora qué?</p>
              <p style="margin:0;font-size:.85rem;color:#2e3a20;line-height:1.5;">En los próximos días recibirás en tu correo la <strong>citación oficial</strong> con el enlace de <strong>Google Meet</strong> para conectarte el día del examen.</p>
            </div>
          </div>
        </div>
      </div>
    </div>`;

  let selectedSlot=null;

  // Listen to BOTH paths and merge counts
  let countFromForms={};
  let countFromRoot={};
  function _rebuildSlotCounts(){
    const merged={};
    [...Object.values(countFromForms),...Object.values(countFromRoot)].forEach(r=>{
      if(r.slotId) merged[r.slotId]=(merged[r.slotId]||0)+1;
    });
    renderStudentSlots(f.slotsMeta||{},merged,selectedSlot,(sid)=>{
      selectedSlot=sid;
      renderStudentSlots(f.slotsMeta||{},merged,selectedSlot,null);
    });
  }
  onValue(ref(db,`forms/${fid}/registrations`),(snap)=>{
    countFromForms=snap.val()||{};
    _rebuildSlotCounts();
  });
  onValue(ref(db,`registrations/${fid}`),(snap)=>{
    countFromRoot=snap.val()||{};
    _rebuildSlotCounts();
  });

  window._submitStudentForm=async(fid)=>{
    const nombre=document.getElementById('sf-nombre').value.trim();
    const apellido=document.getElementById('sf-apellido').value.trim();
    const correo=document.getElementById('sf-correo').value.trim();
    const telefono=document.getElementById('sf-tel').value.trim();
    const err=document.getElementById('sf-err');

    if (!nombre||!apellido||!correo||!telefono||!selectedSlot){
      err.classList.remove('hidden'); return;
    }
    err.classList.add('hidden');
    const btn=document.getElementById('sf-btn');
    btn.disabled=true; btn.textContent='Registrando...';

    // Check if slot is still available — read BOTH paths to get real count
    const [fSnap2,rootRegSnap2]=await Promise.all([
      get(ref(db,`forms/${fid}`)),
      get(ref(db,`registrations/${fid}`))
    ]);
    const f2=fSnap2.val(); if (!f2){btn.disabled=false;btn.textContent='Confirmar inscripción';return;}
    const allRegs2={...(f2.registrations||{}),...(rootRegSnap2.val()||{})};
    const slotMeta=f2.slotsMeta?.[selectedSlot];
    if (!slotMeta){alert('Franja no encontrada.');btn.disabled=false;return;}
    const countInSlot=Object.values(allRegs2).filter(r=>r.slotId===selectedSlot).length;
    if (countInSlot>=slotMeta.max){
      alert('Este horario ya se llenó mientras registrabas. Escoge otro.');
      btn.disabled=false; btn.textContent='Confirmar inscripción'; return;
    }

    // Save registration — write to top-level registrations/ (public write rule)
    try {
      const regRef=push(ref(db,`registrations/${fid}`));
      await set(regRef,{nombre,apellido,correo,telefono,slotId:selectedSlot,ts:Date.now(),meetLink:null});
    } catch(e) {
      btn.disabled=false; btn.textContent='Confirmar inscripción';
      err.textContent='No se pudo guardar tu inscripción. Intenta de nuevo.';
      err.classList.remove('hidden');
      return;
    }

    document.getElementById('sf-form').classList.add('hidden');
    document.getElementById('sf-confirm').classList.remove('hidden');
    document.getElementById('sf-confirm-detail').innerHTML=`
      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="display:flex;gap:10px;align-items:baseline;">
          <span style="color:var(--muted);font-size:.82rem;min-width:80px;">Nombre</span>
          <span style="font-weight:700;">${nombre} ${apellido}</span>
        </div>
        <div style="display:flex;gap:10px;align-items:baseline;">
          <span style="color:var(--muted);font-size:.82rem;min-width:80px;">Correo</span>
          <span>${correo}</span>
        </div>
        <div style="display:flex;gap:10px;align-items:baseline;">
          <span style="color:var(--muted);font-size:.82rem;min-width:80px;">WhatsApp</span>
          <span>${telefono}</span>
        </div>
        <div style="border-top:1px solid var(--border);margin:4px 0;"></div>
        <div style="display:flex;gap:10px;align-items:baseline;">
          <span style="color:var(--muted);font-size:.82rem;min-width:80px;">📅 Fecha y hora</span>
          <span style="font-weight:700;color:var(--accent);font-size:1rem;">${slotMeta.label}</span>
        </div>
        <div style="display:flex;gap:10px;align-items:baseline;">
          <span style="color:var(--muted);font-size:.82rem;min-width:80px;">👩‍🏫 Profesor/a</span>
          <span>${f.teacherName||'—'}</span>
        </div>
        <div style="display:flex;gap:10px;align-items:baseline;">
          <span style="color:var(--muted);font-size:.82rem;min-width:80px;">📚 Nivel</span>
          <span>${f.nivel||''} ${f.grupo||''}</span>
        </div>
      </div>`;
  };
}

function renderStudentSlots(slotsMeta,countBySlot,selectedSlot,onSelect){
  const grid=document.getElementById('sf-slots');
  if (!grid) return;
  grid.innerHTML=Object.entries(slotsMeta).map(([sid,s])=>{
    const count=countBySlot[sid]||0;
    const libre=s.max-count;
    const full=libre<=0;
    const isSelected=selectedSlot===sid;
    const badgeText=full?'Lleno':libre===1?'1 lugar':`${libre} lugares`;
    const badgeCls=full?'badge-red':libre<=2?'badge-yellow':'badge-green';
    return `<button class="franja-pick-btn ${full?'fp-full':''} ${isSelected?'fp-selected':''}"
      ${full?'disabled':''} onclick="window._selectSlot('${sid}')">
      <span>📅 ${s.label}</span>
      <span class="badge ${badgeCls}">${badgeText}</span>
    </button>`;
  }).join('');
  if (onSelect) window._selectSlot=(sid)=>onSelect(sid);
}

</script>
